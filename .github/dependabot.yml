version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-plugins:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
    ignore:
      # AGP / Kotlin / Gradle are tightly coupled with compileSdk 37 and the
      # LibXposed service AAR requirement. Bump them manually as one
      # coordinated migration instead of via Dependabot.
      - dependency-name: "com.android*"
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "*gradle*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
